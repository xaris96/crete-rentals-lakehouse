[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crete-rentals"
version = "0.1.0"
description = "Lakehouse pipeline for Inside Airbnb Crete data on Databricks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Runtime deps stay empty: Databricks provides pyspark and delta, and installing
# our own copies on a cluster would clash with the runtime's versions.
dependencies = []

[project.optional-dependencies]
dev = [
    # ingest.py runs locally and uploads to a volume through the Databricks SDK
    "databricks-sdk>=0.150,<0.160",
    "pyspark>=4.0,<4.3",
    "delta-spark>=4.0,<4.5",
    "pandas>=2.2,<3",
    "pytest>=8",
    "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crete_rentals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
